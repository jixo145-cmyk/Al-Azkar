# Bitrise workflow snippet example (bitrise.yml fragment)

# If you edit bitrise.yml directly, add a script step similar to the following
# before your Flutter build step.

- script:
    title: Prepare keystore
    inputs:
    - content: |-
        #!/bin/bash
        set -euo pipefail
        echo "Preparing Android keystore..."
        chmod +x tools/prepare_keystore.sh
        ./tools/prepare_keystore.sh
        echo "Keystore prepared."
