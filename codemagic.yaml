workflows:
  android-release:
    name: Android Release
    max_build_duration: 120
    environment:
      flutter: stable
      vars:
        BUILD_MODE: release
    scripts:
      - name: Prepare keystore
        script: |
          #!/bin/bash
          set -euo pipefail
          echo "Preparing Android keystore..."
          # Prefer the repo helper if present
          if [ -x tools/prepare_keystore.sh ]; then
            chmod +x tools/prepare_keystore.sh
            ./tools/prepare_keystore.sh
          else
            # Fallback inline decoding (expects secrets in Codemagic UI)
            if [ -z "${KEYSTORE_BASE64:-}" ]; then
              echo "ERROR: KEYSTORE_BASE64 is not set"
              exit 1
            fi
            echo "$KEYSTORE_BASE64" | base64 --decode > android/my-release-key.jks
            chmod 600 android/my-release-key.jks
            cat > android/key.properties <<EOF
            storePassword=$KEYSTORE_PASSWORD
            keyPassword=$KEY_PASSWORD
            keyAlias=$KEY_ALIAS
            storeFile=my-release-key.jks
            EOF
          fi
          echo "Wrote android/my-release-key.jks and android/key.properties"

      - name: Install dependencies
        script: |
          # Install Flutter dependencies and warm up pub-cache
          flutter pub get

      - name: Shim scan (pub-cache)
        script: |
          if [ -x tools/scan_shim_issues.sh ]; then
            chmod +x tools/scan_shim_issues.sh
            ./tools/scan_shim_issues.sh
            echo "--- shim_scan_report.txt ---"
            cat shim_scan_report.txt || true
          else
            echo "No tools/scan_shim_issues.sh found"
          fi

      - name: Build APK (release)
        script: |
          flutter clean
          flutter build apk --release

      - name: Build AAB (release)
        script: |
          # Build Android App Bundle (optional, non-fatal)
          set +e
          flutter build appbundle --release
          set -e

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
      - shim_scan_report.txt

    cache:
      paths:
        - "$HOME/.pub-cache"
        - "$HOME/.gradle"
