workflows:
  android-release:
    name: Android Release
    max_build_duration: 120
    environment:
      flutter: stable
      vars:
        BUILD_MODE: release
    scripts:
      - name: Prepare keystore
        script: |
          #!/bin/bash
          set -euo pipefail
          echo "Preparing Android keystore..."
          chmod +x tools/prepare_keystore.sh
          ./tools/prepare_keystore.sh

      - name: Debug project root
        script: |
          #!/bin/bash
          set -euo pipefail
          echo "Debug: current working directory: $(pwd)"
          echo "Debug: listing top-level files and directories..."
          ls -la
          echo "Searching for pubspec.yaml (depth 3)..."
          find . -maxdepth 3 -name pubspec.yaml -print || true

      - name: Install dependencies
        script: |
          #!/bin/bash
          set -euo pipefail
          flutter pub get

      - name: Shim scan (pub-cache)
        script: |
          if [ -x tools/scan_shim_issues.sh ]; then
            chmod +x tools/scan_shim_issues.sh
            ./tools/scan_shim_issues.sh
            echo "--- shim_scan_report.txt ---"
            cat shim_scan_report.txt || true
          else
            echo "No tools/scan_shim_issues.sh found"
          fi

      - name: Build APK (release)
        script: |
          flutter clean
          flutter build apk --release

      - name: Build AAB (release)
        script: |
          # Build Android App Bundle (optional, non-fatal)
          set +e
          flutter build appbundle --release
          set -e

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
      - shim_scan_report.txt
