workflows:
  android-release:
    name: Android Release
    max_build_duration: 120
    environment:
      flutter: stable
      vars:
        BUILD_MODE: release
    scripts:
      - name: Prepare keystore
        script: |
          #!/bin/bash
          set -euo pipefail
          echo "Preparing Android keystore..."
          chmod +x tools/prepare_keystore.sh
          ./tools/prepare_keystore.sh

      - name: Install dependencies
        script: |
          #!/bin/bash
          set -euo pipefail
          PROJECT_DIR="$(dirname "$(find . -maxdepth 4 -name pubspec.yaml -print | head -n1 || true)")"
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          fi
          echo "Using project dir: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Shim scan (pub-cache)
        script: |
          #!/bin/bash
          set -euo pipefail
          if [ -x tools/scan_shim_issues.sh ]; then
            chmod +x tools/scan_shim_issues.sh
            ./tools/scan_shim_issues.sh
            echo "--- shim_scan_report.txt ---"
            cat shim_scan_report.txt || true
          else
            echo "No tools/scan_shim_issues.sh found"
          fi

      - name: Build APK (release)
        script: |
          #!/bin/bash
          set -euo pipefail
          PROJECT_DIR="$(dirname "$(find . -maxdepth 4 -name pubspec.yaml -print | head -n1 || true)")"
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          fi
          cd "$PROJECT_DIR"
          flutter clean
          flutter build apk --release

      - name: Build AAB (release)
        script: |
          #!/bin/bash
          set -euo pipefail
          PROJECT_DIR="$(dirname "$(find . -maxdepth 4 -name pubspec.yaml -print | head -n1 || true)")"
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          fi
          cd "$PROJECT_DIR"
          set +e
          flutter build appbundle --release
          set -e

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
      - shim_scan_report.txt
