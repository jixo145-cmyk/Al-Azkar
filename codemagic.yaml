workflows:
  android-release:
    name: Android Release
    environment:
      flutter: stable
    scripts:
      - name: Prepare keystore
        script: |
          # Exit on error
          set -euo pipefail
          echo "Preparing Android keystore..."
          # Use the helper already present in the repo (tools/prepare_keystore.sh)
          if [ -x tools/prepare_keystore.sh ]; then
            chmod +x tools/prepare_keystore.sh
            ./tools/prepare_keystore.sh
          else
            # Fallback: decode KEYSTORE_BASE64 inline
            if [ -z "${KEYSTORE_BASE64:-}" ]; then
              echo "ERROR: KEYSTORE_BASE64 is not set"
              exit 1
            fi
            echo "$KEYSTORE_BASE64" | base64 --decode > android/my-release-key.jks
            chmod 600 android/my-release-key.jks
            cat > android/key.properties <<EOF
            storePassword=$KEYSTORE_PASSWORD
            keyPassword=$KEY_PASSWORD
            keyAlias=$KEY_ALIAS
            storeFile=my-release-key.jks
            EOF
          fi
          echo "Wrote android/my-release-key.jks and android/key.properties"
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Scan for shim issues
        script: |
          if [ -x tools/scan_shim_issues.sh ]; then
            chmod +x tools/scan_shim_issues.sh
            ./tools/scan_shim_issues.sh
            echo "--- shim_scan_report.txt ---"
            cat shim_scan_report.txt || true
          else
            echo "No scan_shim_issues.sh found"
          fi
      - name: Build APK (release)
        script: |
          flutter clean
          flutter build apk --release
